name: Refresh Build Tooling Pins

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

concurrency:
  group: refresh-build-tooling-pins
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh Build Tooling Pins
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Refresh Go toolchain pins
        run: make refresh-go-toolchain

      - name: Refresh golangci-lint version pin
        run: |
          latest="$(curl -fsSL https://api.github.com/repos/golangci/golangci-lint/releases/latest | jq -r '.tag_name')"
          printf '%s\n' "${latest}" > .golangci-lint-version

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            Dockerfile
            .golangci-lint-version
            go.mod
          branch: automation/refresh-go-toolchain
          commit-message: "chore: refresh build tooling pins"
          title: "chore: refresh build tooling pins"
          body: |
            Refreshes the preferred Go toolchain version in `go.mod` to the
            latest stable Go release published on `go.dev`, aligns the Docker
            build image pin, and refreshes the pinned `golangci-lint` release
            version.
          delete-branch: true
          labels: |
            dependencies
            go

      # A pull request opened with GITHUB_TOKEN doesn't trigger pull_request workflows, so
      # Build and Validate and Container Image are dispatched on the branch instead. Without a
      # release_ref, Container Image only builds and smoke tests the image, which matters here
      # because the refresh changes the Dockerfile and Build and Validate doesn't build it.
      # Neither run fires workflow_run; the daily Automation Auto Merge sweep merges the pull
      # request once both have passed.
      - name: Validate the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run build-and-validate.yml --ref automation/refresh-go-toolchain
          gh workflow run container-image.yml --ref automation/refresh-go-toolchain
