name: Build and Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      website: ${{ steps.classify.outputs.website }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Nothing the binary, the packages or the lint reads lives under these paths, so a change
      # confined to them only needs Quality, and only when it touches the site (the Go tests read
      # its CLI reference). Anything else, or any doubt about the base, runs every job.
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          base=''
          case "${EVENT_NAME}" in
            pull_request)
              # The checkout is the pull request merged into its base, so the first parent is the base.
              base="$(git rev-parse HEAD^1)"
              ;;
            push)
              # Against the last commit main passed on rather than the previous push, whose run may
              # have been cancelled before it tested anything.
              base="$(gh run list --workflow build-and-validate.yml --branch "${GITHUB_REF_NAME}" --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)"
              ;;
          esac

          code=true
          website=true
          if [ -n "${base}" ] && git merge-base --is-ancestor "${base}" HEAD 2>/dev/null; then
            changed="$(git diff --name-only "${base}" HEAD)"
            if [ -n "${changed}" ] && ! grep -qvE '^(website/|docs/|assets/|[^/]+\.md$|LICENSE$)' <<<"${changed}"; then
              code=false
              grep -q '^website/' <<<"${changed}" || website=false
            fi
          fi
          echo "Compared with ${base:-nothing}: code=${code} website=${website}"
          {
            echo "code=${code}"
            echo "website=${website}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check gofmt formatting
        run: make fmt-check

      - name: Validate GitHub Pages website
        run: |
          npm ci --prefix website
          make website-build
          make website-check

      - name: Run vet
        run: make vet

      - name: Run tests
        run: make test

      - name: Build binary
        run: make build

      - name: Validate packaging and website assets
        run: |
          bash -n scripts/*.sh scripts/*/*.sh
          bash scripts/release/generate-release-notes.sh '' HEAD /tmp/s3ctl-release-notes.md
          grep -F '## Release Overview' /tmp/s3ctl-release-notes.md
          grep -F '## Installation' /tmp/s3ctl-release-notes.md
          grep -F '## Published Artifacts' /tmp/s3ctl-release-notes.md
          bash scripts/release/next-release.sh > /tmp/s3ctl-next-release.txt
          grep -F 'release_required=' /tmp/s3ctl-next-release.txt

          bash scripts/install.sh --help > /tmp/s3ctl-install-help.txt
          grep -F -- '--version <tag|latest>' /tmp/s3ctl-install-help.txt
          test -f website/dist/index.html

          make build-cross GOOS=linux GOARCH=amd64 OUTPUT=dist/s3ctl-linux-amd64
          bash scripts/package/build-deb-package.sh dist/s3ctl-linux-amd64 dist v0.0.0 amd64
          test -f dist/s3ctl_0.0.0_amd64.deb

      - name: Smoke test built binary
        run: |
          ./dist/s3ctl --version | tee /tmp/s3ctl-version.txt
          grep -F 'Version:' /tmp/s3ctl-version.txt

          ./dist/s3ctl --version --output json > /tmp/s3ctl-version.json
          grep -F '"binary": "s3ctl"' /tmp/s3ctl-version.json
          grep -F '"version":' /tmp/s3ctl-version.json

          ./dist/s3ctl | tee /tmp/s3ctl-no-args.txt
          grep -F 'Usage:' /tmp/s3ctl-no-args.txt
          grep -F 'Common workflows:' /tmp/s3ctl-no-args.txt

          ./dist/s3ctl --help | tee /tmp/s3ctl-help.txt
          grep -F 'Core options:' /tmp/s3ctl-help.txt
          grep -F -- '--help-full' /tmp/s3ctl-help.txt

          ./dist/s3ctl --help-full | tee /tmp/s3ctl-help-full.txt
          grep -F 'Configuration precedence:' /tmp/s3ctl-help-full.txt
          grep -F 'Built-in scoped credential policy templates:' /tmp/s3ctl-help-full.txt

          ./dist/s3ctl --config examples/aws/s3ctl.json --dry-run --output json > /tmp/s3ctl-config.json
          grep -F '"resource_count": 2' /tmp/s3ctl-config.json
          grep -F '"bucket_name": "app-data"' /tmp/s3ctl-config.json
          grep -F '"created": true' /tmp/s3ctl-config.json

          ./dist/s3ctl --bucket app-data --create-scoped-credentials --dry-run > /tmp/s3ctl-single.txt
          grep -F 'Bucket create planned: yes' /tmp/s3ctl-single.txt
          grep -F 'IAM user: app-data' /tmp/s3ctl-single.txt

          ./dist/s3ctl --batch-file examples/aws/s3ctl-batch.csv --create-scoped-credentials --dry-run --output json > /tmp/s3ctl-batch.json
          grep -F '"bucket_name": "logs-archive"' /tmp/s3ctl-batch.json
          grep -F '"policy_template": "bucket-readonly"' /tmp/s3ctl-batch.json

          ./dist/s3ctl \
            --bucket flag-bucket \
            --endpoint https://objects.example.com \
            --create-scoped-credentials \
            --dry-run > /tmp/s3ctl-flags.txt
          grep -F 'Bucket: flag-bucket' /tmp/s3ctl-flags.txt
          grep -F 'IAM user: flag-bucket' /tmp/s3ctl-flags.txt

          mkdir -p /tmp/s3ctl-config-home/s3ctl
          cat > /tmp/s3ctl-config-home/s3ctl/config.json <<'EOF'
          {
            "endpoint": "https://config.example.com",
            "create_scoped_credentials": true
          }
          EOF
          XDG_CONFIG_HOME=/tmp/s3ctl-config-home ./dist/s3ctl --bucket auto-config --dry-run > /tmp/s3ctl-default-config.txt
          grep -F 'Bucket: auto-config' /tmp/s3ctl-default-config.txt
          grep -F 'Endpoint: https://config.example.com' /tmp/s3ctl-default-config.txt
          grep -F 'IAM user: auto-config' /tmp/s3ctl-default-config.txt
