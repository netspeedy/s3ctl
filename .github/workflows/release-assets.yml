name: Release Assets

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release tag to publish with the current workflow definition, for example v1.2.3 or v1.2.3-rc.1
        required: false
        type: string

concurrency:
  group: release-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

env:
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}

permissions:
  contents: read

jobs:
  verify-release-tag:
    name: Verify Release Tag
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_ref || '', 'v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: Ensure release tag points to main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_branch="${DEFAULT_BRANCH}"
          release_commit="$(git rev-parse HEAD^0)"

          git fetch origin "${default_branch}:refs/remotes/origin/${default_branch}" --force
          git merge-base --is-ancestor "${release_commit}" "refs/remotes/origin/${default_branch}"

  binaries:
    name: Build Binary ${{ matrix.label }}
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_ref || '', 'v'))
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: linux/amd64
            goos: linux
            goarch: amd64
            goarm: ""
            artifact_name: s3ctl-linux-amd64
            deb_arch: amd64
          - label: linux/arm64
            goos: linux
            goarch: arm64
            goarm: ""
            artifact_name: s3ctl-linux-arm64
            deb_arch: arm64
          - label: linux/arm/v7
            goos: linux
            goarch: arm
            goarm: "7"
            artifact_name: s3ctl-linux-armv7
            deb_arch: armhf
          - label: darwin/amd64
            goos: darwin
            goarch: amd64
            goarm: ""
            artifact_name: s3ctl-darwin-amd64
            deb_arch: ""
          - label: darwin/arm64
            goos: darwin
            goarch: arm64
            goarm: ""
            artifact_name: s3ctl-darwin-arm64
            deb_arch: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "version=${RELEASE_REF:-dev}"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: |
          mkdir -p dist
          make build-cross \
            VERSION=${{ steps.meta.outputs.version }} \
            COMMIT=${{ steps.meta.outputs.commit }} \
            BUILD_DATE=${{ steps.meta.outputs.build_date }} \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            GOARM=${{ matrix.goarm }} \
            OUTPUT=dist/${{ matrix.artifact_name }}

      - name: Archive binary
        run: |
          cd dist
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Build Debian package
        if: ${{ matrix.deb_arch != '' }}
        run: |
          bash scripts/package/build-deb-package.sh \
            dist/${{ matrix.artifact_name }} \
            dist \
            "${{ steps.meta.outputs.version }}" \
            "${{ matrix.deb_arch }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz

      - name: Upload Debian package artifact
        if: ${{ matrix.deb_arch != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.artifact_name }}
          path: dist/*.deb

  publish:
    name: Publish GitHub Release
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_ref || '', 'v'))
    needs:
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.tar.gz *.deb > SHA256SUMS

      - name: Sign checksums
        id: sign
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "No signing key configured; skipping SHA256SUMS signature."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

          key_id="${APT_GPG_KEY_ID}"
          if [ -z "${key_id}" ]; then
            key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          fi

          passphrase_args=()
          if [ -n "${APT_GPG_PASSPHRASE}" ]; then
            passphrase_args=(--pinentry-mode loopback --passphrase "${APT_GPG_PASSPHRASE}")
          fi

          cd dist
          gpg --batch --yes "${passphrase_args[@]}" \
            --local-user "${key_id}" \
            --armor --detach-sign \
            --output "SHA256SUMS.asc" \
            "SHA256SUMS"

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Classify release tag
        id: release
        run: |
          ref_name="${RELEASE_REF}"

          if [[ "${ref_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            prerelease=true
          elif [[ "${ref_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          else
            echo "Unsupported release tag format: ${ref_name}" >&2
            exit 1
          fi
          previous_tag="$(bash scripts/release/previous-tag.sh "${ref_name}")"

          {
            echo "prerelease=${prerelease}"
            echo "previous_tag=${previous_tag}"
            echo "release_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          mkdir -p release
          bash scripts/release/generate-release-notes.sh \
            "${{ steps.release.outputs.previous_tag }}" \
            "${{ steps.release.outputs.release_sha }}" \
            release/release-notes.md

      - name: Publish release
        env:
          DEFAULT_GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export GH_TOKEN="${DEFAULT_GH_TOKEN}"
          release_ref="${RELEASE_REF}"

          orphan_draft_ids="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"${release_ref}\" and (.html_url | contains(\"/releases/tag/untagged-\"))) | .id" || true
          )"
          if [ -n "${orphan_draft_ids}" ]; then
            while IFS= read -r release_id; do
              [ -n "${release_id}" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            done <<< "${orphan_draft_ids}"
          fi

          mapfile -t assets < <(
            find dist -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name 'SHA256SUMS' -o -name 'SHA256SUMS.asc' \) \
              | sort
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were staged for upload" >&2
            exit 1
          fi

          if gh release view "${release_ref}" >/dev/null 2>&1; then
            gh release upload "${release_ref}" --clobber "${assets[@]}"

            edit_args=(
              --draft=false
              --title "${release_ref}"
              --notes-file release/release-notes.md
            )
            if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
              edit_args+=(--prerelease)
            else
              edit_args+=(--latest)
            fi

            gh release edit "${release_ref}" "${edit_args[@]}"
            exit 0
          fi

          create_args=(
            --title "${release_ref}"
            --notes-file release/release-notes.md
          )
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            create_args+=(--prerelease)
          else
            create_args+=(--latest)
          fi

          gh release create "${release_ref}" "${assets[@]}" "${create_args[@]}"

  # The first stable release of a new line (vX.Y.0) freezes the docs of the line before it. They're
  # rebuilt from the last commit before the new line started, under /<repo>/vX.Y/, and attached to
  # that line's last release, where the Pages workflow picks them up.
  docs-archive:
    name: Build Archived Docs
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_ref || '', 'v'))
    needs:
      - publish
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
      asset: ${{ steps.line.outputs.asset }}
      tag: ${{ steps.line.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.CHECKOUT_REF }}

      - name: Find the outgoing line
        id: line
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          skip() {
            printf '%s\n' "$1" >> "${GITHUB_STEP_SUMMARY}"
            echo "archive=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            skip "\`${RELEASE_REF}\` doesn't start a new line, so no docs are archived."
          fi

          previous_tag="$(bash scripts/release/previous-tag.sh "${RELEASE_REF}")"
          if [ -z "${previous_tag}" ]; then
            skip "\`${RELEASE_REF}\` is the first release, so there's no earlier line to archive."
          fi
          line="$(sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/' <<<"${previous_tag}")"

          if ! commit="$(bash scripts/release/docs-archive-commit.sh "${previous_tag}" "${RELEASE_REF}")"; then
            skip "No commit between \`${previous_tag}\` and \`${RELEASE_REF}\` starts a new line, so no docs are archived."
          fi
          site_dir="$(git ls-tree -r --name-only "${commit}" | sed -n 's|^\([^/]*\)/astro\.config\.mjs$|\1|p' | head -n1)"
          if [ -z "${site_dir}" ] || ! git show "${commit}:${site_dir}/astro.config.mjs" | grep -q SITE_ARCHIVE; then
            skip "The ${line} docs at \`${commit}\` predate versioned docs, so they aren't archived."
          fi

          git worktree add --detach archive-src "${commit}"
          {
            echo "archive=true"
            echo "line=${line}"
            echo "tag=${previous_tag}"
            echo "commit=${commit}"
            echo "site_dir=${site_dir}"
            echo "asset=${REPO_NAME}-docs-${line}.tar.gz"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.line.outputs.archive == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archive-src/${{ steps.line.outputs.site_dir }}/package-lock.json

      - name: Write the archived docs' release details
        if: steps.line.outputs.archive == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.line.outputs.tag }}
        run: |
          set -euo pipefail

          # The pages show the line's last release, as they did while it was the latest.
          site_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > archive-release.json
          fingerprint="$(curl -fsSL "${site_url}apt/${{ github.event.repository.name }}-archive-keyring.fingerprint.txt" 2>/dev/null | tr -d '\n' || true)"
          jq -n \
            --arg release_commit "$(git rev-list -n 1 "${TAG}")" \
            --arg fingerprint "${fingerprint}" \
            --slurpfile latest_release archive-release.json \
            '{
              release_commit: $release_commit,
              latest_release: $latest_release[0],
              apt_repository: { available: ($fingerprint != ""), fingerprint: $fingerprint }
            }' > "${RUNNER_TEMP}/archive-metadata.json"

      # A failed archive mustn't fail the release, which the release automation waits on. The
      # summary says what happened, and docs/release.md has the steps to build one by hand.
      - name: Build the archived docs
        id: build
        if: steps.line.outputs.archive == 'true'
        continue-on-error: true
        env:
          LINE: ${{ steps.line.outputs.line }}
          TAG: ${{ steps.line.outputs.tag }}
          COMMIT: ${{ steps.line.outputs.commit }}
          SITE_DIR: ${{ steps.line.outputs.site_dir }}
          ASSET: ${{ steps.line.outputs.asset }}
        run: |
          set -euo pipefail

          printf "Building the %s docs from \`%s\` for release \`%s\`.\n" "${LINE}" "${COMMIT}" "${TAG}" >> "${GITHUB_STEP_SUMMARY}"
          npm ci --prefix "archive-src/${SITE_DIR}"
          export SITE_ARCHIVE="${LINE}" SITE_METADATA_FILE="${RUNNER_TEMP}/archive-metadata.json"
          make -C archive-src website-build website-check WEBSITE_DIR="${SITE_DIR}"
          tar -C "archive-src/${SITE_DIR}/dist" -czf "${ASSET}" .

          printf "Archived them as \`%s\`.\n" "${ASSET}" >> "${GITHUB_STEP_SUMMARY}"
          echo "built=true" >> "${GITHUB_OUTPUT}"

      - name: Report a failed archive
        if: steps.line.outputs.archive == 'true' && steps.build.outputs.built != 'true'
        run: |
          echo "::warning::The ${{ steps.line.outputs.line }} docs archive didn't build, so the line isn't published. See docs/release.md to build it by hand."
          echo "The archive didn't build; see the step log. docs/release.md has the steps to build it by hand." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload archived docs
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-archive
          path: ${{ steps.line.outputs.asset }}

  publish-docs-archive:
    name: Publish Archived Docs
    if: needs.docs-archive.outputs.built == 'true'
    needs:
      - docs-archive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archived docs
        uses: actions/download-artifact@v8
        with:
          name: docs-archive

      - name: Attach them to the line's last release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.docs-archive.outputs.tag }}
          ASSET: ${{ needs.docs-archive.outputs.asset }}
        run: gh release upload "${TAG}" "${ASSET}" --clobber --repo "${GITHUB_REPOSITORY}"
